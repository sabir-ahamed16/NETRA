<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>

    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/script.js" ></script>
</head>
<body>
    
<header class="topbar">
         <!-- this block for logo and title -->
    <div class="brand">

        <div class="brand-logo">
            N

        </div>

            <div>
                <h1>NETRA</h1>
                <p>ROBOT MONITORING SYSTEM</p>
             </div>

    </div>

       <!-- this block for navigation -->
   <nav>

    <a href="#Dashboard">Dashboard</a>

    <a href="#Fleet">Fleet</a>

    <a href="#Telemetry">Telemetry</a>

    <a href="#Alerts">Alerts</a>

   </nav>
 
   <!-- This block shows system status and time -->

   <div class="header-right">
    <span class="online-dot"></span>
    <span>SYSTEM ONLINE</span>
    <strong id="clock">--:--:--</strong>

    </div>

    <!-- this block shows the button -->
     
    <button id="dispatch-open" type="button">+ Dispatch Mission</button>


   



</header>
 <!-- THis is the main section -->
  <main class="page">
    <section class="kpi-grid">
        <article class="kpi-card">
            <span>ROVERS ONLINE </span>
           <h1 id ="online-count">5/6</h1>
           <p>Active Rover Units</p>
        </article>

          <article class="kpi-card">
            <span>AVERAGE BATTERY LEVEL </span>
           <h1 id ="battery-level">62%</h1>
           <p>Fleet Battery Level</p>
        </article>

        <article class="kpi-card">
            <span>OPEN ALERTS </span>
           <h1 id ="alert-count">1</h1>
           <p>Requires attention</p>
        </article>

         <article class="kpi-card">
            <span>DISTANCE TODAY </span>
           <h1 id ="distance-today">69.96 km</h1>
           <p>Total simulated result</p>
        </article>
    </section>
  </main>

</body>
</html>
